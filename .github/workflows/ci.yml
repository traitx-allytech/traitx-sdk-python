name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit + conformance tests (stdlib unittest, no dependencies)
        run: python -m unittest discover -s tests -v
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Package metadata check
        run: |
          python -m pip install twine
          python -m twine check dist/*

  typecheck:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    # main currently has 37 mypy errors in traitx/decision.py; advisory until
    # they are fixed, then drop continue-on-error so it gates merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .[dev]
      - run: python -m mypy traitx
